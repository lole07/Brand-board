function shrink(file,max){return new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const im=new Image;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}
async function addImgs(files){const cat=mcat=='Todas'?'Cinematografía':mcat;for(const f of files)if(f.type.startsWith('image/'))cur.mood.push({cat,src:await shrink(f,600),note:'',why:'',how:''});save();keep()}

function fichaVideo(){const b=cur,v=b.vd;let vi=Math.min(v.st||0,VS.length-1),lt=null,armed=0;const o=document.createElement('div');o.className='vf';document.body.append(o);
